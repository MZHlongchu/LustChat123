name: Android FOSS Build

on:
  push:
    tags:
      - "tfoss*"

permissions:
  contents: write     

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Change package to lustchat.ll3
        run: |
          sed -i 's/applicationId = "lastchat.rikkafork.cocolal"/applicationId = "lustchat.ll3"/' app/build.gradle.kts
          echo "✅ Package: lustchat.ll3"

      ##### 新增：彻底移除跟踪库（Google Firebase/AdMob）#####
      - name: Remove tracking libraries
        run: |
          BUILD_FILE="app/build.gradle.kts"
          
          echo "Removing Firebase/AdMob tracking libraries..."
          
          # 移除 Firebase BOM（物料清单平台）
          sed -i '/firebase.bom/d' "$BUILD_FILE"
          
          # 移除 Firebase Analytics（分析追踪）
          sed -i '/firebase.analytics/d' "$BUILD_FILE"
          
          # 移除 Firebase Crashlytics（崩溃报告追踪）
          sed -i '/firebase.crashlytics/d' "$BUILD_FILE"
          
          # 移除 Firebase Config（远程配置，可能用于追踪）
          sed -i '/firebase.config/d' "$BUILD_FILE"
          
          # 同时移除 Google Play Services 广告（如果有的话）
          sed -i '/play-services-ads/d' "$BUILD_FILE"
          sed -i '/gms.*admob/d' "$BUILD_FILE"
          
          echo "✅ Tracking libraries removed"
          echo "--- Remaining dependencies (firebase/gms related) ---"
          grep -iE "(firebase|gms|admob|play.services)" "$BUILD_FILE" || echo "None found (clean)"

      ##### 移除风险权限（显式声明的 + 依赖库注入的广告权限）#####
      - name: Remove risky permissions
        run: |
          cat > /tmp/foss_permissions.xml << 'EOF'
          <!-- FOSS: Remove ad/tracking permissions injected by Google libraries -->
          <uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove" />
          <uses-permission android:name="android.permission.ACCESS_ADSERVICES_AD_ID" tools:node="remove" />
          <uses-permission android:name="android.permission.ACCESS_ADSERVICES_ATTRIBUTION" tools:node="remove" />
          <uses-permission android:name="android.permission.ACCESS_ADSERVICES_TOPICS" tools:node="remove" />
          EOF

          find app/src -name "AndroidManifest.xml" -type f | while read manifest; do
            echo "Processing: $manifest"
            
            sed -i '/android.permission.WRITE_SETTINGS/d' "$manifest"
            sed -i '/android.permission.QUERY_ALL_PACKAGES/d' "$manifest"
            sed -i '/android.permission.POST_PROMOTED_NOTIFICATIONS/d' "$manifest"
            
            if ! grep -q 'AD_ID.*tools:node="remove"' "$manifest"; then
              sed -i '/<\/manifest>/e cat /tmp/foss_permissions.xml' "$manifest"
              echo "✅ Injected remove-node for ad permissions"
            fi
            
            echo "Final permissions in $manifest:"
            grep -E "uses-permission" "$manifest" | head -15 || true
          done

      ##### 禁用自动更新检查 #####
      - name: Disable auto-update
        run: |
          UPDATE_CHECKER="app/src/main/java/me/rerere/rikkahub/utils/UpdateChecker.kt"
          if [ -f "$UPDATE_CHECKER" ]; then
            sed -i 's|https://api.github.com/repos/54xzh/LastChat/releases|https://disabled.in.foss.build/updates|' "$UPDATE_CHECKER"
            echo "✅ Auto-update disabled"
          fi

      ##### 生成绿色 L 图标 #####
      - name: Generate launcher icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          
          for src_dir in "app/src/main" "app/src/plus"; do
            mkdir -p "$src_dir/res/mipmap-"{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
            
            for size in 48 72 96 144 192; do
              case $size in
                48) dir="mdpi" ;;
                72) dir="hdpi" ;;
                96) dir="xhdpi" ;;
                144) dir="xxhdpi" ;;
                192) dir="xxxhdpi" ;;
              esac
              
              convert -size ${size}x${size} xc:"#4CAF50" \
                -fill white \
                -gravity center \
                -pointsize $((size/2)) \
                -annotate +0+0 "L" \
                "$src_dir/res/mipmap-${dir}/ic_launcher_lastchat.png"
              
              cp "$src_dir/res/mipmap-${dir}/ic_launcher_lastchat.png" "$src_dir/res/mipmap-${dir}/ic_launcher_lastchat_round.png"
              
              convert -size ${size}x${size} xc:none \
                -fill "#4CAF50" \
                -gravity center \
                -pointsize $((size*2/3)) \
                -annotate +0+0 "L" \
                "$src_dir/res/mipmap-${dir}/ic_launcher_lastchat_foreground.png"
            done
            echo "✅ Generated icons for $src_dir"
          done

      - name: Prepare signing
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
            echo "✅ Release signing configured"
          else
            echo "ℹ️ Using debug signing"
          fi

      - name: Build FOSS APK
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assemblePlusRelease --no-daemon --rerun-tasks --stacktrace

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: app/build/outputs/apk/plus/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

