name: Clean Build Without Google

on:
  push:
    tags:
      - "clean*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Remove Firebase dependencies
        run: |
          # 注释掉 Firebase 相关依赖
          sed -i '/\/\/ Firebase/,/^$/s/^/# /' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.google.services)/\/\/ alias(libs.plugins.google.services)/' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.firebase.crashlytics)/\/\/ alias(libs.plugins.firebase.crashlytics)/' app/build.gradle.kts
          echo "✅ Firebase dependencies removed"

      - name: Build Plus Release
        run: |
          chmod +x gradlew
          ./gradlew assemblePlusRelease --no-daemon --stacktrace

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: lastchat-clean
          path: app/build/outputs/apk/plus/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/plus/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

