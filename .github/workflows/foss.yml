name: Android FOSS Build

on:
  push:
    tags:
      - "foss*"

permissions:
  contents: write     

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      ##### 修复：使用合法包名 lustchat.ll3（不能以数字开头）#####
      - name: Change package to lustchat.ll3
        run: |
          sed -i 's/applicationId = "lastchat.rikkafork.cocolal"/applicationId = "lustchat.ll3"/' app/build.gradle.kts
          echo "✅ Package: lustchat.ll3"

      - name: Generate launcher icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          mkdir -p app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
          
          for size in 48 72 96 144 192; do
            case $size in
              48) dir="mdpi" ;;
              72) dir="hdpi" ;;
              96) dir="xhdpi" ;;
              144) dir="xxhdpi" ;;
              192) dir="xxxhdpi" ;;
            esac
            
            convert -size ${size}x${size} xc:"#4CAF50" \
              -fill white \
              -gravity center \
              -pointsize $((size/2)) \
              -annotate +0+0 "LC" \
              app/src/main/res/mipmap-${dir}/ic_launcher.png
              
            cp app/src/main/res/mipmap-${dir}/ic_launcher.png app/src/main/res/mipmap-${dir}/ic_launcher_round.png
          done
          
          echo "✅ Icons generated"

      - name: Prepare signing
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
            echo "✅ Release signing"
          else
            echo "ℹ️ Debug signing"
          fi

      - name: Build FOSS APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePlusRelease --no-daemon --stacktrace

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: app/build/outputs/apk/plus/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

