name: Android FOSS Build

on:
  push:
    tags:
      - "vfoss*"

permissions:
  contents: write     

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Change package to lustchat.ll3
        run: |
          sed -i 's/applicationId = "lastchat.rikkafork.cocolal"/applicationId = "lustchat.ll3"/' app/build.gradle.kts
          echo "✅ Package: lustchat.ll3"

      ##### 修复：同时更新 main 和 plus 的图标 #####
      - name: Generate launcher icon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          
          # 需要更新 both main 和 plus 目录（因为构建 plus flavor 时 plus 会覆盖 main）
          for src_dir in "app/src/main" "app/src/plus"; do
            mkdir -p "$src_dir/res/mipmap-"{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
            
            for size in 48 72 96 144 192; do
              case $size in
                48) dir="mdpi" ;;
                72) dir="hdpi" ;;
                96) dir="xhdpi" ;;
                144) dir="xxhdpi" ;;
                192) dir="xxxhdpi" ;;
              esac
              
              # 生成绿色 LC 图标
              convert -size ${size}x${size} xc:"#4CAF50" \
                -fill white \
                -gravity center \
                -pointsize $((size/2)) \
                -annotate +0+0 "LC" \
                "$src_dir/res/mipmap-${dir}/ic_launcher.png"
                
              cp "$src_dir/res/mipmap-${dir}/ic_launcher.png" "$src_dir/res/mipmap-${dir}/ic_launcher_round.png"
            done
            echo "✅ Generated icons for $src_dir"
          done
          
          # 清理旧构建缓存，强制重新打包资源
          rm -rf app/build/intermediates/res
          ./gradlew clean --no-daemon || true

      - name: Prepare signing
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
            echo "✅ Release signing"
          else
            echo "ℹ️ Debug signing"
          fi

      - name: Build FOSS APK
        run: |
          chmod +x gradlew
          # 添加 --rerun-tasks 确保资源任务重新执行
          ./gradlew :app:assemblePlusRelease --no-daemon --rerun-tasks --stacktrace

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: app/build/outputs/apk/plus/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

