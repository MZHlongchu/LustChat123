name: Rename Package

on:
  workflow_dispatch:
    inputs:
      new_package:
        description: 'New package name (e.g., lustchat.lastchat.rikkafork.cocolal.plus)'
        required: true
        default: 'lustchat.lastchat.rikkafork.cocolal.plus'
      branch_name:
        description: 'Branch name for the renamed version'
        required: true
        default: 'cocolal-fork'

jobs:
  rename-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create rename script
        run: |
          cat > rename-package.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          OLD_PACKAGE="me.rerere.rikkahub"
          NEW_PACKAGE="${{ github.event.inputs.new_package }}"
          OLD_PATH=$(echo "$OLD_PACKAGE" | tr '.' '/')
          NEW_PATH=$(echo "$NEW_PACKAGE" | tr '.' '/')
          
          echo "=========================================="
          echo "Renaming package"
          echo "From: $OLD_PACKAGE"
          echo "To:   $NEW_PACKAGE"
          echo "=========================================="
          
          # 1. 重命名主源码
          echo "1. Renaming main source directory..."
          mkdir -p "app/src/main/java/$NEW_PATH"
          cp -r "app/src/main/java/$OLD_PATH"/* "app/src/main/java/$NEW_PATH/" 2>/dev/null || true
          rm -rf "app/src/main/java/$OLD_PATH"
          
          # 2. 重命名flavored源码
          for flavor in plus zh; do
            if [ -d "app/src/$flavor/java/$OLD_PATH" ]; then
              echo "1.$flavor. Renaming $flavor source..."
              mkdir -p "app/src/$flavor/java/$NEW_PATH"
              cp -r "app/src/$flavor/java/$OLD_PATH"/* "app/src/$flavor/java/$NEW_PATH/" 2>/dev/null || true
              rm -rf "app/src/$flavor/java/$OLD_PATH"
            fi
          done
          
          # 3. 更新build.gradle.kts
          echo "2. Updating build.gradle.kts..."
          sed -i "s/namespace = \"$OLD_PACKAGE\"/namespace = \"$NEW_PACKAGE\"/" app/build.gradle.kts
          
          # 4. 更新AndroidManifest.xml
          echo "3. Updating AndroidManifest.xml..."
          sed -i "s/package=\"$OLD_PACKAGE\"/package=\"$NEW_PACKAGE\"/" app/src/main/AndroidManifest.xml
          
          # 5. 更新Kotlin文件
          echo "4. Updating Kotlin files..."
          find app/src -name "*.kt" -type f -exec sed -i "s/^package $OLD_PACKAGE/package $NEW_PACKAGE/" {} \;
          find app/src -name "*.kt" -type f -exec sed -i "s/import $OLD_PKG/import $NEW_PKG/g" {} \;
          
          # 6. 更新XML文件
          echo "5. Updating XML files..."
          find app/src -name "*.xml" -type f -exec sed -i "s/android:name=\"\.$OLD_PACKAGE/android:name=\".$NEW_PACKAGE/g" {} \;
          find app/src -name "*.xml" -type f -exec sed -i "s/android:name=\"$OLD_PACKAGE/android:name=\"$NEW_PACKAGE/g" {} \;
          
          # 7. 清理构建缓存
          echo "6. Cleaning build cache..."
          rm -rf app/build
          rm -rf build
          
          echo "✓ Rename completed!"
          EOF

      - name: Run rename script
        run: |
          chmod +x rename-package.sh
          ./rename-package.sh

      - name: Verify rename
        run: |
          if grep -r "me.rerere.rikkahub" app/src --include="*.kt" --include="*.xml" 2>/dev/null; then
            echo "ERROR: Old package name still exists!"
            exit 1
          fi
          echo "✓ Verification passed"

      - name: Test build
        run: |
          chmod +x gradlew
          ./gradlew assemblePlusDebug --no-daemon --stacktrace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: rename package to ${{ github.event.inputs.new_package }}"
          title: "Package Rename: ${{ github.event.inputs.new_package }}"
          body: |
            This PR renames the package for custom build.
            - New package: `${{ github.event.inputs.new_package }}`
            - Branch: `${{ github.event.inputs.branch_name }}`
          branch: ${{ github.event.inputs.branch_name }}
          base: main
