name: Android FOSS Build

on:
 push:
   tags:
     - "foss*"

permissions:
 contents: write     

jobs:
 build:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout
       uses: actions/checkout@v4
       with:
         fetch-depth: 0

     - name: Set up JDK 17
       uses: actions/setup-java@v4
       with:
         distribution: temurin
         java-version: "17"
         cache: gradle

     - name: Prepare signing config
       run: |
         if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
           echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
           echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
           echo "✅ Release signing configured"
         else
           echo "ℹ️ Debug signing mode"
         fi

     - name: Change package to lustchat.123
       run: |
         FILE="app/build.gradle"
         [ -f "app/build.gradle.kts" ] && FILE="app/build.gradle.kts"
         
         sed -i "s/applicationId.*/applicationId \"lustchat.123\"/" "$FILE"
         echo "✅ Package changed to lustchat.123"

     - name: Build FOSS APK
       run: |
         chmod +x gradlew
         ./gradlew :app:assemblePlusRelease --no-daemon --stacktrace

     - name: Upload artifact
       uses: actions/upload-artifact@v4
       with:
         name: lustchat-foss-apk
         path: app/build/outputs/apk/plus/release/*.apk

     - name: Release
       uses: softprops/action-gh-release@v2
       with:
         files: app/build/outputs/apk/plus/release/*.apk
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

