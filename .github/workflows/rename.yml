name: Android Release Build

on:
  push:
    tags:
      - "*zh*"
      - "*plus*"
      - "foss*"
      - "cocolal*"
      - "[0-9]*"

permissions:
  contents: write     

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Detect build configuration
        id: config
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_LOWER="$(echo "$TAG" | tr '[:upper:]' '[:lower:]')"
          
          FLAVOR="plus"
          BUILD_WITHOUT_FIREBASE="false"
          RENAME_PACKAGE="false"
          OLD_PACKAGE="me.rerere.rikkahub"
          NEW_PACKAGE=""
          
          if [[ "$TAG_LOWER" == "cocolal"* ]]; then
            FLAVOR="plus"
            BUILD_WITHOUT_FIREBASE="true"
            RENAME_PACKAGE="true"
            NEW_PACKAGE="lustchat.lastchat.rikkafork.cocolal.plus"
            echo "🌱 Cocolal mode: Custom package, no Firebase"
          elif [[ "$TAG_LOWER" == "foss"* ]]; then
            FLAVOR="plus"
            BUILD_WITHOUT_FIREBASE="true"
            echo "🌱 FOSS mode: No Firebase"
          elif [[ "$TAG_LOWER" == *"zh"* ]]; then
            FLAVOR="zh"
          elif [[ "$TAG_LOWER" == *"plus"* ]]; then
            FLAVOR="plus"
          else
            FLAVOR="plus"
            BUILD_WITHOUT_FIREBASE="true"
            echo "⚠️ Default mode: No Firebase"
          fi
          
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "build_without_firebase=$BUILD_WITHOUT_FIREBASE" >> "$GITHUB_OUTPUT"
          echo "rename_package=$RENAME_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "old_package=$OLD_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "new_package=$NEW_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Rename package structure
        if: steps.config.outputs.rename_package == 'true'
        run: |
          set -euo pipefail
          
          OLD_PKG="${{ steps.config.outputs.old_package }}"
          NEW_PKG="${{ steps.config.outputs.new_package }}"
          OLD_PATH=$(echo "$OLD_PKG" | tr '.' '/')
          NEW_PATH=$(echo "$NEW_PKG" | tr '.' '/')
          
          echo "🔄 Renaming: $OLD_PKG → $NEW_PKG"
          
          # 1. 更新 build.gradle.kts
          sed -i "s/namespace = \"$OLD_PKG\"/namespace = \"$NEW_PKG\"/" app/build.gradle.kts
          
          # 2. 更新 AndroidManifest.xml
          sed -i "s/package=\"$OLD_PKG\"/package=\"$NEW_PKG\"/" app/src/main/AndroidManifest.xml
          
          # 3. 创建新目录并移动文件
          mkdir -p "app/src/main/java/$NEW_PATH"
          cp -r "app/src/main/java/$OLD_PATH"/* "app/src/main/java/$NEW_PATH/" 2>/dev/null || true
          rm -rf "app/src/main/java/$OLD_PATH"
          
          # 4. 更新 package 声明
          find "app/src/main/java/$NEW_PATH" -name "*.kt" -type f -exec sed -i "s/^package $OLD_PKG/package $NEW_PKG/" {} \;
          
          # 5. 全局替换 import
          find app/src -name "*.kt" -type f -exec sed -i "s/import $OLD_PKG/import $NEW_PKG/g" {} \;
          
          # 6. 更新 XML 引用
          find app/src -name "*.xml" -type f -exec sed -i "s/android:name=\"\.$OLD_PKG/android:name=\".$NEW_PKG/g" {} \;
          find app/src -name "*.xml" -type f -exec sed -i "s/android:name=\"$OLD_PKG/android:name=\"$NEW_PKG/g" {} \;
          
          echo "✅ Package rename completed"

      - name: ⚠️ CRITICAL: Disable KSP incremental compilation
        if: steps.config.outputs.rename_package == 'true'
        run: |
          # 禁用 KSP 增量编译以防止缓存污染
          echo "ksp.incremental=false" >> local.properties
          echo "ksp.incremental.log=true" >> local.properties
          echo "✅ KSP incremental compilation DISABLED"

      - name: ⚠️ CRITICAL: Clean all build caches
        if: steps.config.outputs.rename_package == 'true'
        run: |
          echo "🧹 Cleaning EVERYTHING..."
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf app/build
          rm -rf build
          ./gradlew clean --no-daemon --rerun-tasks
          echo "✅ All caches purged"

      - name: Prepare Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64_PLUS: ${{ secrets.GOOGLE_SERVICES_JSON_B64_PLUS }}
          GOOGLE_SERVICES_JSON_B64_ZH: ${{ secrets.GOOGLE_SERVICES_JSON_B64_ZH }}
        run: |
          set -euo pipefail
          FLAVOR="${{ steps.config.outputs.flavor }}"
          BUILD_WITHOUT_FIREBASE="${{ steps.config.outputs.build_without_firebase }}"
          
          mkdir -p "app/src/$FLAVOR"
          
          if [[ "$BUILD_WITHOUT_FIREBASE" == "true" ]]; then
            echo "🌱 Building without Firebase"
          elif [[ "$FLAVOR" == "plus" && -n "${GOOGLE_SERVICES_JSON_B64_PLUS:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64_PLUS" | base64 -d > "app/src/plus/google-services.json"
            echo "✅ Configured Firebase for plus flavor"
          elif [[ "$FLAVOR" == "zh" && -n "${GOOGLE_SERVICES_JSON_B64_ZH:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64_ZH" | base64 -d > "app/src/zh/google-services.json"
            echo "✅ Configured Firebase for zh flavor"
          else
            echo "⚠️ No Firebase credentials, building without it"
          fi

      - name: Build APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          
          FLAVOR="${{ steps.config.outputs.flavor }}"
          FLAVOR_CAP=$(echo "$FLAVOR" | sed 's/\b\w/\U&/')
          
          echo "📦 Building ${FLAVOR} flavor..."
          ./gradlew "app:assemble${FLAVOR_CAP}Release" --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.config.outputs.flavor }}${{ steps.config.outputs.build_without_firebase == 'true' && '-foss' || '' }}${{ steps.config.outputs.rename_package == 'true' && '-cocolal' || '' }}
          path: app/build/outputs/apk/${{ steps.config.outputs.flavor }}/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/${{ steps.config.outputs.flavor }}/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

